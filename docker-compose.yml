services:
  postgres:
    image: postgres:16-alpine
    container_name: dealflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow123
      POSTGRES_DB: dealflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
