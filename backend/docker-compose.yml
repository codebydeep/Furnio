version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: dealflow_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dealflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealflow} -d ${POSTGRES_DB:-dealflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
